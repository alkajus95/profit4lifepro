<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Copy Trading | Weltrade</title>
<link rel="icon" href="icono.ico" type="image/x-icon">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Copy trading profesional en índices sintéticos con Weltrade. Pago único 35 USD. Capital mínimo 300 USD. Resultados reales.">

<style>
:root{
  --bg:#0a0e1a;
  --bg-gradient:linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
  --card:rgba(17, 24, 39, 0.8);
  --card-hover:rgba(30, 41, 59, 0.9);
  --primary:#3b82f6;
  --primary-dark:#2563eb;
  --accent:#10b981;
  --accent-light:#34d399;
  --text:#f9fafb;
  --muted:#9ca3af;
  --border:rgba(255, 255, 255, 0.1);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background:var(--bg-gradient);
  color:var(--text);
  line-height:1.6;
  overflow-x:hidden;
  position:relative;
}

body::before{
  content:'';
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:
    radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
  pointer-events:none;
  z-index:0;
}

.container{
  
  max-width:1200px;

  margin:auto;
  padding:0 20px;
  position:relative;
  z-index:1;
  
}

/* LANGUAGE SWITCH */
.lang-switch{
  position:fixed;
  top:20px;
  right:20px;
  display:flex;
  gap:8px;
  z-index:999;
  background:var(--card);
  padding:6px;
  border-radius:50px;
  border:1px solid var(--border);
  backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
}

.lang-switch button{
  background:transparent;
  color:var(--muted);
  border:none;
  padding:8px 20px;
  border-radius:50px;
  cursor:pointer;
  font-weight:600;
  transition:all 0.3s ease;
  font-size:14px;
}

.lang-switch button:hover{
  color:var(--text);
}

.lang-switch button.active{
  background:var(--primary);
  color:white;
  box-shadow:0 4px 12px rgba(59, 130, 246, 0.4);
}

/* HEADER */
header{
  margin-top: 100px;
  padding:100px 0 60px;
  text-align:center;
  animation:fadeInDown 0.8s ease;
}

@keyframes fadeInDown{
  from{
    opacity:0;
    transform:translateY(-30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

header h1{
  font-size:clamp(2rem, 6vw, 3.5rem);
  margin-top: 100px;
  margin-bottom:20px;
  font-weight:800;
  background:linear-gradient(135deg, var(--text) 0%, var(--accent-light) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1.2;
}

header p{
  color:var(--muted);
  max-width:700px;
  margin:auto;
  font-size:clamp(1rem, 2vw, 1.25rem);
  animation:fadeIn 1s ease 0.3s both;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

.cta-btn{
  display:inline-block;
  margin-top:32px;
  padding:16px 48px;
  background:linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
  color:white;
  font-weight:700;
  border-radius:50px;
  text-decoration:none;
  font-size:18px;
  box-shadow:0 8px 24px rgba(16, 185, 129, 0.3);
  transition:all 0.3s ease;
  animation:fadeInUp 1s ease 0.5s both;
}

@keyframes fadeInUp{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.cta-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 32px rgba(16, 185, 129, 0.5);
}

/* SECTIONS */
section{
  padding:60px 0;
}

h2{
  text-align:center;
  margin-bottom:50px;
  font-size:clamp(1.8rem, 4vw, 2.5rem);
  font-weight:700;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
  gap:24px;
}

.stat{
  background:var(--card);
  padding:32px 24px;
  border-radius:20px;
  text-align:center;
  border:1px solid var(--border);
  backdrop-filter:blur(10px);
  transition:all 0.4s ease;
  animation:fadeInScale 0.6s ease both;
}

@keyframes fadeInScale{
  from{
    opacity:0;
    transform:scale(0.9);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.stat:nth-child(1){animation-delay:0.1s}
.stat:nth-child(2){animation-delay:0.2s}
.stat:nth-child(3){animation-delay:0.3s}
.stat:nth-child(4){animation-delay:0.4s}

.stat:hover{
  transform:translateY(-8px);
  background:var(--card-hover);
  border-color:var(--primary);
  box-shadow:0 16px 40px rgba(59, 130, 246, 0.2);
}

.stat span{
  display:block;
  font-size:clamp(1.8rem, 4vw, 2.5rem);
  font-weight:800;
  background:linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:8px;
}

.stat p{
  color:var(--muted);
  font-size:15px;
}

/* VIDEO */
.video-box{
  max-width:400px;
  margin:auto;
  aspect-ratio:9/16;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 25px 60px rgba(0, 0, 0, 0.6);
  border:2px solid var(--border);
  transition:all 0.4s ease;
}

.video-box:hover{
  transform:scale(1.02);
  box-shadow:0 30px 70px rgba(59, 130, 246, 0.3);
  border-color:var(--primary);
}

.video-box iframe{
  width:100%;
  height:100%;
  border:0;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
  gap:24px;
}

.card{
  background:var(--card);
  padding:32px 24px;
  border-radius:20px;
  text-align:center;
  font-weight:600;
  font-size:16px;
  border:1px solid var(--border);
  backdrop-filter:blur(10px);
  transition:all 0.4s ease;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:4px;
  background:linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
  transform:scaleX(0);
  transition:transform 0.4s ease;
}

.card:hover::before{
  transform:scaleX(1);
}

.card:hover{
  transform:translateY(-8px);
  background:var(--card-hover);
  border-color:var(--primary);
  box-shadow:0 16px 40px rgba(59, 130, 246, 0.2);
}

/* PRICE */
.price-box{
  background:var(--card);
  border:2px solid var(--border);
  padding:50px 30px;
  border-radius:24px;
  text-align:center;
  max-width:500px;
  margin:auto;
  backdrop-filter:blur(10px);
  box-shadow:0 20px 50px rgba(0, 0, 0, 0.5);
  transition:all 0.4s ease;
}

.price-box:hover{
  transform:translateY(-8px);
  border-color:var(--primary);
  box-shadow:0 25px 60px rgba(59, 130, 246, 0.3);
}

.price{
  font-size:clamp(3rem, 8vw, 4.5rem);
  font-weight:900;
  background:linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:16px;
}

.price-box p{
  color:var(--muted);
  font-size:16px;
  margin-bottom:8px;
}

/* FOOTER */
footer{
  padding:40px 20px;
  text-align:center;
  font-size:14px;
  color:var(--muted);
  border-top:1px solid var(--border);
  margin-top:60px;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:24px;
  right:24px;
  width:64px;
  height:64px;
  background:linear-gradient(135deg, #25D366 0%, #128C7E 100%);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  text-decoration:none;
  color:white;
  box-shadow:0 8px 24px rgba(37, 211, 102, 0.5);
  z-index:999;
  transition:all 0.3s ease;
  animation:pulse 2s ease infinite;
}

@keyframes pulse{
  0%, 100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.05);
  }
}

.whatsapp:hover{
  transform:scale(1.1);
  box-shadow:0 12px 32px rgba(37, 211, 102, 0.7);
}

/* RESPONSIVE */
@media (max-width: 768px){
  header{
    padding:80px 0 40px;
  }
  
  section{
    padding:40px 0;
  }
  
  .stats{
    grid-template-columns:1fr;
    gap:16px;
  }
  
  .cards{
    grid-template-columns:1fr;
    gap:16px;
  }
  
  .video-box{
    max-width:100%;
  }
  
  .lang-switch{
    top:15px;
    right:15px;
  }
  
  .whatsapp{
    width:56px;
    height:56px;
    font-size:28px;
    bottom:20px;
    right:20px;
  }
  
  .cta-btn{
    padding:14px 36px;
    font-size:16px;
    margin-bottom: 30px;
  }
}

@media (max-width: 480px){
  
  
  header h1{
    font-size:1.8rem;
    
  }
  
  h2{
    font-size:1.6rem;
    margin-bottom:30px;
  }
  
  .stat{
    padding:24px 16px;
  }
  
  .card{
    padding:24px 16px;
  }
  
  .price-box{
    padding:40px 20px;
  }
}
</style>
</head>

<script>
